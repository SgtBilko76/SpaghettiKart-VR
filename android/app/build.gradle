plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.spaghettikart.vr'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'dev.spaghettikart.vr'
        minSdk 29
        targetSdk 32
        versionCode 2
        versionName '0.2.0-beta1'

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                // The game is too slow to play unoptimized, so always build the native code optimized
                arguments '-DUSE_OPENGLES=ON', '-DENABLE_OPENXR=ON', '-DANDROID_STL=c++_shared', '-DCMAKE_BUILD_TYPE=Release'
                targets 'Spaghettify', 'SDL2'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sideloaded personal build: sign with the local debug key
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.31.6'
        }
    }

    buildFeatures {
        prefab true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // Play Store policy; Meta Horizon OS apps target API 32
        disable 'ExpiredTargetSdkVersion'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    // Khronos OpenXR loader; Meta Horizon OS provides the runtime
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.63'
}
